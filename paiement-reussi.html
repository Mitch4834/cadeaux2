
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement réussi - Fête & Cadeaux</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .success-box {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 40px 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }

    .icon { font-size: 65px; }

    h1 { color: #712a90; }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #712a90;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="success-box">
    <div class="icon">⏳</div>
    <h1>Vérification du paiement</h1>
    <p>Nous vérifions votre transaction. Veuillez patienter...</p>
  </div>
  
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const transactionId = params.get("transactionId");

  if (!transactionId) {
    document.querySelector("p").textContent =
      "Aucune référence de transaction n'a été reçue.";
    return;
  }

  // Transmission au système de vérification Fête & Cadeaux
  const API_URL = "URL_API_FETE_ET_CADEAUX";

  fetch(
    API_URL + "?action=verifyPayment&transactionId=" +
    encodeURIComponent(transactionId)
  )
    .then(response => response.json())
    .then(data => {
      console.log("Vérification Fête & Cadeaux :", data);
    })
    .catch(error => {
      console.error("Erreur de vérification :", error);
    });
})();
</script>

</body>
</html>
